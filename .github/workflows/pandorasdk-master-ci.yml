name: PandoraSDK master + LCContent

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pandorasdk-master:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/alma9-cvmfs
      options: --privileged
      volumes:
        - /home/runner/.cache/ccache:/root/.cache/ccache
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Clone PandoraSDK master
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: PandoraPFA/PandoraSDK
          path: PandoraSDK
          ref: master

      - name: Mount CVMFS
        run: /mount.sh

      - shell: bash
        run: echo "NOW=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v5
        with:
          path: /home/runner/.cache/ccache
          key: ccache-pandorasdk-master-${{ env.NOW }}
          restore-keys: |
            ccache-pandorasdk-master-

      - name: Setup ccache
        run: |
          set -e
          export CCACHE_DIR=/root/.cache/ccache
          export CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime
          ccache --set-config=max_size=500M
          ccache -z

      - name: Setup Key4hep stack
        run: |
          set -e
          source /cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh
          declare -p | grep -Ev 'BASHOPTS|BASH_VERSINFO|EUID|PPID|SHELLOPTS|UID' > /env.sh
          declare -f >> /env.sh
          echo cd $GITHUB_WORKSPACE >> /env.sh

      - name: Build PandoraSDK from master
        run: |
          set -e
          source /env.sh
          cd PandoraSDK
          cmake -B build -S . -GNinja \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/PandoraSDK/install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -- -j$(nproc)
          cmake --install build
          k4_local_repo

      - name: Build LCContent
        run: |
          set -e
          source /env.sh
          k4_local_repo
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/PandoraSDK/install" \
            -GNinja
          ninja -k0 install
          ccache -s

      - name: Test
        run: |
          set -e
          source /env.sh
          cd build
          ctest -j $(nproc) --output-on-failure

      - name: Upload CTest logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CTest logs_pandorasdk-master_run${{ github.run_id }}_attempt${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/build/Testing/Temporary
            !${{ github.workspace }}/build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn
          retention-days: 3
